<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --mint:      #d6fffc;
  --mint-mid:  #b0f0ec;
  --teal:      #0f8b8d;
  --teal-dark: #0a5c5e;
  --teal-xd:   #073c3e;
  --white:     #e8fff9;
  --orange:    #f97316;
  --orange-dk: #d4620b;
  --orange-lt: #fff0e6;
  --ink:       #0d2526;
  --ink-soft:  #3d5e60;
  --ink-muted: #6a8c8e;
  --border:    #b8e8e5;
  --border-lt: #d0f4f1;
}

html, body {
  height: 100%;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(180deg, #f0faf9 0%, #e8f6f5 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-size: 14px;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ─── HEADER ─── */
.site-header {
  background: var(--teal-dark);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 20px rgba(7,60,62,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 22px;
  gap: 12px;
}
.logo-block {
  width: 20px;
  height: 20px;
  background: var(--orange);
  border-radius: 6px;
  box-shadow: 0 0 14px rgba(249,115,22,0.6);
  animation: blink-logo 1.8s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes blink-logo {
  0%, 45% { opacity: 1; }
  55%, 100% { opacity: 0.35; }
}
.header-title {
  font-family: 'DM Mono', monospace;
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 0.5px;
  color: var(--mint);
  white-space: nowrap;
}

/* ─── MAIN ─── */
main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 18px;
}

.panel {
  width: 100%;
  max-width: 860px;
  background: var(--white);
  border: 3px solid var(--border-lt);
  border-radius: 16px;
  box-shadow: 0 2px 16px rgba(15,139,141,0.10);
  padding: 36px 32px 40px;
}
.panel-title {
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 26px;
}

.tools-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.tool-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 12px;
  text-decoration: none;
  color: var(--ink);
  background: #fff;
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 30px 22px 26px;
  transition: all 0.2s;
  box-shadow: 0 2px 8px rgba(15,139,141,0.06);
}
.tool-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(15,139,141,0.14);
}
.tool-card.hipoteca { border-color: var(--border); }
.tool-card.hipoteca:hover { border-color: var(--teal); }
.tool-card.gastos { border-color: var(--border); }
.tool-card.gastos:hover { border-color: var(--orange); }

.tool-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
}
.tool-card.hipoteca .tool-icon {
  background: var(--mint);
  border: 1.5px solid var(--border);
}
.tool-card.gastos .tool-icon {
  background: var(--orange-lt);
  border: 1.5px solid #ffd9a0;
}

.tool-name {
  font-family: 'DM Mono', monospace;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: -0.3px;
  color: var(--teal-dark);
}
.tool-card.gastos .tool-name { color: var(--orange-dk); }

.tool-desc {
  font-size: 12px;
  line-height: 1.6;
  color: var(--ink-soft);
  max-width: 300px;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  body { font-size: 15px; }
  .site-header { padding: 14px; }
  .header-title { font-size: 16px; }
  main { padding: 20px 12px; }
  .panel { padding: 24px 14px 28px; }
  .tools-grid { grid-template-columns: 1fr; }
  .tool-card { padding: 24px 16px; }
}
</style>
</head>
<body>

<!-- ═══════════ HEADER ═══════════ -->
<header class="site-header">
  <span class="logo-block"></span>
  <span class="header-title">Finance Tools</span>
</header>

<!-- ═══════════ HERRAMIENTAS ═══════════ -->
<main>
  <div class="panel">

    <div class="panel-title">Selecciona una herramienta</div>

    <div class="tools-grid">

      <a class="tool-card hipoteca" href="simulador-hipoteca.html">
        <span class="tool-icon">🏠</span>
        <span class="tool-name">Simulador Hipoteca</span>
        <span class="tool-desc">Cuotas, vinculaciones, bonificaciones, impuestos y viabilidad de compra.</span>
      </a>

      <a class="tool-card gastos" href="gestor-gastos.html">
        <span class="tool-icon">💰</span>
        <span class="tool-name">Gestor de Gastos</span>
        <span class="tool-desc">Ingresos, gastos fijos y variables, gráficos y resumen anual.</span>
      </a>

    </div>

  </div>
</main>

</body>
</html>
