<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --mint:      #d6fffc;
  --mint-mid:  #b0f0ec;
  --teal:      #0f8b8d;
  --teal-dark: #0a5c5e;
  --teal-xd:   #073c3e;
  --white:     #e8fff9;
  --orange:    #f97316;
  --orange-dk: #d4620b;
  --orange-lt: #fff0e6;
  --ink:       #0d2526;
  --ink-soft:  #3d5e60;
  --ink-muted: #6a8c8e;
  --border:    #b8e8e5;
  --border-lt: #d0f4f1;
}

html, body {
  height: 100%;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(180deg, #f0faf9 0%, #e8f6f5 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-size: 14px;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ─── TÍTULO PRINCIPAL ─── */
.hero {
  padding: 72px 22px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 26px;
}
.hero-top {
  display: flex;
  align-items: center;
  gap: 24px;
}
.logo-block {
  width: 44px;
  height: 44px;
  background: var(--orange);
  border-radius: 12px;
  box-shadow: 0 0 24px rgba(249,115,22,0.55);
  animation: blink-logo 1.8s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes blink-logo {
  0%, 45% { opacity: 1; }
  55%, 100% { opacity: 0.35; }
}
.hero-title {
  font-family: 'DM Mono', monospace;
  font-size: 46px;
  font-weight: 500;
  letter-spacing: 1.5px;
  color: var(--teal-dark);
  text-shadow: 0 2px 24px rgba(15,139,141,0.18);
}
.hero-sub {
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 0.3px;
  color: var(--ink-soft);
  max-width: 900px;
  line-height: 1.5;
}

/* ─── PANEL ─── */
main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 56px 18px 80px;
}

.panel {
  width: 100%;
  max-width: 1020px;
  background: var(--white);
  border: 3px solid var(--border-lt);
  border-radius: 28px;
  box-shadow: 0 4px 32px rgba(15,139,141,0.12);
  padding: 64px 60px 72px;
}
.panel-title {
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 24px;
  font-weight: 500;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 52px;
}

.tools-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 36px;
}

.tool-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 24px;
  text-decoration: none;
  color: var(--ink);
  background: #fff;
  border: 4px solid var(--border);
  border-radius: 28px;
  padding: 60px 40px 52px;
  transition: all 0.2s;
  box-shadow: 0 4px 16px rgba(15,139,141,0.08);
}
.tool-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 14px 40px rgba(15,139,141,0.18);
}
.tool-card.hipoteca:hover { border-color: var(--teal); }
.tool-card.gastos:hover { border-color: var(--orange); }

.tool-icon {
  width: 104px;
  height: 104px;
  border-radius: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 52px;
  flex-shrink: 0;
}
.tool-card.hipoteca .tool-icon {
  background: var(--mint);
  border: 3px solid var(--border);
}
.tool-card.gastos .tool-icon {
  background: var(--orange-lt);
  border: 3px solid #ffd9a0;
}

.tool-name {
  font-family: 'DM Mono', monospace;
  font-size: 34px;
  font-weight: 500;
  letter-spacing: -0.5px;
  color: var(--teal-dark);
}
.tool-card.gastos .tool-name { color: var(--orange-dk); }

.tool-desc {
  font-size: 22px;
  line-height: 1.6;
  color: var(--ink-soft);
  max-width: 560px;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  body { font-size: 15px; }
  .hero { padding: 44px 14px 0; gap: 18px; }
  .hero-top { gap: 16px; }
  .logo-block { width: 34px; height: 34px; border-radius: 9px; }
  .hero-title { font-size: 34px; }
  .hero-sub { font-size: 17px; }
  main { padding: 36px 12px 60px; }
  .panel { padding: 40px 16px 48px; }
  .panel-title { font-size: 18px; letter-spacing: 3px; margin-bottom: 36px; }
  .tools-grid { grid-template-columns: 1fr; gap: 24px; }
  .tool-card { padding: 40px 20px 36px; }
  .tool-icon { width: 84px; height: 84px; border-radius: 22px; font-size: 42px; }
  .tool-name { font-size: 26px; }
  .tool-desc { font-size: 17px; }
}
</style>
</head>
<body>

<!-- ═══════════ TÍTULO ═══════════ -->
<div class="hero">
  <div class="hero-top">
    <span class="logo-block"></span>
    <span class="hero-title">Finance Tools</span>
  </div>
  <div class="hero-sub">(Calculadoras para gestiones financieras como hipotecas, gastos e inversiones)</div>
</div>

<!-- ═══════════ HERRAMIENTAS ═══════════ -->
<main>
  <div class="panel">

    <div class="panel-title">Selecciona una herramienta</div>

    <div class="tools-grid">

      <a class="tool-card hipoteca" href="simulador-hipoteca.html">
        <span class="tool-icon">🏠</span>
        <span class="tool-name">Simulador Hipoteca</span>
        <span class="tool-desc">Cuotas, vinculaciones, bonificaciones, impuestos y viabilidad de compra.</span>
      </a>

      <a class="tool-card gastos" href="gestor-gastos.html">
        <span class="tool-icon">💰</span>
        <span class="tool-name">Gestor de Gastos</span>
        <span class="tool-desc">Ingresos, gastos fijos y variables, gráficos y resumen anual.</span>
      </a>

    </div>

  </div>
</main>

</body>
</html>
